import com.github.gradle.node.npm.task.NpmTask

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'io.github.mooner1022.slplugin'
    id 'com.github.node-gradle.node'
}

android {
    namespace 'dev.mooner.starlightide'
    compileSdk 35

    defaultConfig {
        applicationId "dev.mooner.starlightide"
        minSdk 26
        targetSdk 33
        versionCode 1
        // Used as the plugin version in starlight.json checks.
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all { test ->
            // Tests have Ktor and SLF4J without the Ktor plugin's provider.
            test.systemProperty 'slf4j.provider', 'org.slf4j.helpers.NOP_FallbackServiceProvider'
            // Lets the test client send headers such as Origin.
            test.systemProperty 'sun.net.http.allowRestrictedHeaders', 'true'
        }
    }
}

starlight {
    sdk {
        // Build these from the StarLight repository: ./gradlew :PluginCore:assembleRelease :ConfigDSL:assembleRelease
        pluginCore = file("libs/PluginCore-release.aar")
        configDsl = file("libs/ConfigDSL-release.aar")
        excludeHostKotlinLibraries = true
    }
    deploy {
        // Pass -Pstarlight.device=<serial or ip:port> or set STARLIGHT_DEVICE.
        // Restarting force-stops StarLight on the device; opt in per run with -Pstarlight.restartApp=true.
    }
}

// ---------------------------------------------------------------- web page

node {
    download = true
    version = "22.12.0"
    // The Node.js repository is declared in settings.gradle.
    distBaseUrl = null
    npmInstallCommand = "ci"
    nodeProjectDir = rootProject.file("web")
}

// The page ships as Java resources under web/, read through the class loader. Plugin assets would need an
// assetRevision bump for every change of the page.
def webResources = layout.buildDirectory.dir("generated/webResources")

def buildWeb = tasks.register('buildWeb', NpmTask) {
    dependsOn 'npmInstall'
    args = ['run', 'build']
    environment = ['WEB_OUT_DIR': webResources.get().dir("web").asFile.path]
    inputs.dir(rootProject.file("web/src"))
    inputs.files(rootProject.files("web/index.html", "web/package.json", "web/package-lock.json", "web/vite.config.ts", "web/tsconfig.json", "web/scripts"))
    outputs.dir(webResources)
}

android.sourceSets.main.resources.srcDir(webResources)
tasks.named('preBuild') { dependsOn buildWeb }

// ---------------------------------------------------------------- dependencies

def ktorVersion = "3.6.0"

dependencies {
    // Provided by StarLight at runtime.
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    compileOnly "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    compileOnly "androidx.core:core-ktx:1.16.0"
    compileOnly "androidx.appcompat:appcompat:1.7.0"
    compileOnly "com.google.android.material:material:1.12.0"
    // Provided by the Ktor plugin (starlight.json: "ktor@3.6.0"); keep the versions equal.
    compileOnly "io.ktor:ktor-server-cio:$ktorVersion"
    // Provided by the Workspace plugin (starlight.json: "workspace@1.0.0"); the jar is its apiJar output.
    compileOnly files("libs/workspace-api-1.0.0.jar")

    testImplementation "junit:junit:4.13.2"
    // The compiler's stdlib; without it the test classpath settles on the older one Ktor asks for.
    testImplementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.20"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    testImplementation "io.ktor:ktor-server-cio:$ktorVersion"
    testImplementation files("libs/workspace-api-1.0.0.jar")
}
